name: CI

# Solo framework quality gate. npm workspace project (api/package-lock.json);
# all work runs under api/.
#
#   static — autocheck --static PER SERVICE (declaration/registration sync,
#            param conventions, auth-fork ban, etc.). No Redis.
#            ⚠️ Run it per service dir: pointed at the api root the structure
#            check bails out ("纯文档/设计阶段") and the gate silently checks
#            NOTHING — that hollow form is exactly how drift accumulated.
#            Also runs `--lib` once against api/library/ (flat dir, no service
#            scaffolding, invisible to the per-service loop above) for the redis
#            anti-pattern rule subset — entity.js's full-scan pattern and the
#            scanIterator v5 batch bug both went unchecked here for a release
#            cycle before this was added.
#   test   — jest against a Redis service. Runs the proven-green hermetic subset
#            (allow-list in jest.ci.config.js — the list IS the count, don't copy a
#            number here). Excluded suites (external-API agent tests, script-style
#            "tests") are tracked in jest.ci.config.js. Same job then runs the
#            autocheck/simulation scenarios (concurrency/TOCTOU against real Redis) —
#            7 scenarios that a static rule verified EXIST but nothing ever executed
#            until 2026-09-04.
#   upgrade-path — scaffold a throwaway consumer with init.sh, plant sentinels in the
#            [Project]/[Solo]/[Solo→Project] zones, fake an older .solo-version, run
#            upgrade.sh (dry-run, real, again) and assert the zone contract + doctor.sh
#            green (deploy/check-upgrade-path.sh). init.sh/upgrade.sh had zero coverage
#            before; v1.2.8's "upgrade silently erased a project's security decision"
#            is the class of bug this catches.
#   e2e    — full-stack black-box regression (e2e/ standalone project): boots the
#            REAL 15-service mesh + mock-listener chain against redis-stack and
#            runs every suite under e2e/suites (the directory is the count — don't
#            copy a number here). This is the gate that catches "behavior changed,
#            tests didn't" drift the hermetic subset can't see (toFix §6.x).
#   portal-tsc — type-check both portals (system + operator). Cheap, no mesh.
#   frontend-build — build the EXACT artifacts init.sh ships (deploy/build-frontend.sh
#            → portal/publish + client/publish tarballs) and upload them. portal-tsc
#            only type-checks source and ui-e2e serves source via vite — neither
#            exercises the shipped bundle, so a build break in the distributed
#            artifact path was previously invisible to CI. Uploaded artifacts are
#            the version-pinned (.solo-version) bundles other projects consume.
#   ui-e2e — Playwright against the REAL system portal + mesh (e2e/ui). This is the
#            FRONTEND's regression net — the layer that catches human-journey breaks
#            the API tests can't (it's how the create-drops-event_subscriptions gap
#            surfaced). NON-BLOCKING for now (continue-on-error) while we stabilize;
#            promote to blocking once it's proven low-flake.
#
# static / test / e2e / portal-tsc / frontend-build / upgrade-path are blocking; ui-e2e is non-blocking (for now).
# Security scanning: `npm audit` (prod deps) runs in static — critical blocks, high is report-only
# until the 6 known highs (2026-09-04: axios, form-data, http-proxy-middleware, nodemailer, sharp,
# urllib) are cleared; CodeQL lives in codeql.yml; Dependabot in .github/dependabot.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: api

jobs:
  static:
    name: Static quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: autocheck --static (per service — root form is a silent no-op)
        run: |
          set -e
          fail=0
          for d in apps/collection apps/planner apps/fulfillment apps/storage apps/market apps/approval \
                   core/ingress core/notification core/user core/agent core/nexus core/orchestrator \
                   core/administrator core/gateway sample; do
            echo "::group::autocheck $d"
            if ! node autocheck/checker.js "$d" --static; then
              echo "::error::autocheck failed for $d"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
      - name: autocheck --lib (api/library — flat dir, no service scaffolding)
        run: |
          # 服务侧的 logic/ 只是各服务自己的代码；api/library/ 是被所有服务共用的
          # 契约库，entity.js 的全量拉取反模式、scanIterator v5 批次坑都曾在这里潜伏
          # 而没被 per-service 循环扫到（结构检查会把它当"纯文档/设计阶段服务"跳过）。
          # --lib 模式跳过服务脚手架假设，只跑 redis 反模式规则子集，WARN 级不阻断。
          node autocheck/checker.js library --lib
      - name: doc-drift (CLAUDE.md §2 ↔ services.json)
        working-directory: .
        run: node deploy/check-doc-drift.js
      - name: error-code coverage + collision (library/jsonrpc.js CODES registry)
        working-directory: .
        run: node deploy/check-error-codes.js
      - name: extension-kit gate (ESM 单测 + manifest 注入清单交叉检查)
        working-directory: client/extension-kit
        run: |
          set -e
          # kit 必须先同步进扩展根内部（扩展根是封闭的树，见 sync.sh 顶部）——
          # sample/kit/ 是 gitignore 的产物，CI 的干净 checkout 里还不存在。
          bash sync.sh sample
          # manifest 的 js 注入清单 ↔ 代码里的 self.<全局> 引用
          node lint-injection.js sample
          # kit 是 ESM，用 api 那份 jest（README §7 的命令，不额外装依赖）
          PATH="$PWD/../../api/node_modules/.bin:$PATH" npm test
      - name: lockfile hygiene (npm only · single public registry)
        working-directory: .
        run: |
          set -e
          if git ls-files '*yarn.lock' | grep -q .; then
            echo "::error::yarn.lock committed — repo standardizes on npm (package-lock.json only):"
            git ls-files '*yarn.lock'; exit 1
          fi
          bad=$(git ls-files '*package-lock.json' | xargs grep -lE 'registry\.(npmmirror\.com|npm\.taobao\.org|cnpmjs\.org)' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::package-lock pinned to a mirror registry (normalize resolved URLs to registry.npmjs.org):"
            echo "$bad"; exit 1
          fi
          echo "lockfile hygiene OK"
      - name: npm audit — production deps, critical (BLOCKING)
        # 只看随 bundle 发给下游的生产依赖；dev 依赖（jest 等）不进 bundle。
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit — production deps, high (report only until the known 6 are cleared)
        # 2026-09-04 基线：axios / form-data / http-proxy-middleware / qs / urllib 有非 major 修复
        # （`npm audit fix` 即可，随后过 CLAUDE.md §6.1 锁文件门禁）；nodemailer 9 / sharp 0.35 是 major，
        # 分别要验 gateway SMTP 与 storage 图像路径。清零后把这一步的 continue-on-error 删掉。
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Unit + Redis-backed tests
    runs-on: ubuntu-latest
    services:
      redis:
        # redis-stack-server (not plain redis): some services use RedisJSON/Search.
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: jest (green subset — see jest.ci.config.js)
        run: npx jest -c jest.ci.config.js --ci --runInBand
      - name: simulation scenarios (autocheck/simulation — concurrency / TOCTOU against real Redis)
        # DB 15 隔离，每个场景前后 FLUSHDB；这个 Redis 是本 job 专用容器。此前只有
        # static/simulation-coverage.js 检查「场景文件存在」，场景本身从没在 CI 里执行过。
        run: TEST_REDIS_URL=redis://localhost:6379/15 node autocheck/simulation/run.js

  upgrade-path:
    name: Upgrade path (init → tamper → upgrade.sh ×3 → zone contract + doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: install api deps (init.sh needs api/node_modules/{tweetnacl,bs58}; build.sh bundles from api/)
        run: npm ci
      - name: scaffold a throwaway consumer, plant sentinels, upgrade, assert
        # 顶层 defaults 把 cwd 放在 api/；脚本按自己的位置定位仓库根，这里显式回到根。
        working-directory: .
        run: bash deploy/check-upgrade-path.sh

  e2e:
    name: Full-stack e2e (live mesh, all suites)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        # The harness reuses an external Redis when one answers on 6699
        # (redis-stack: orchestrator/storage need RedisJSON).
        image: redis/redis-stack-server:latest
        ports:
          - 6699:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6699
      E2E_PROFILE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            e2e/package-lock.json
      - name: install api deps (services spawn from api/)
        run: npm ci
      - name: install e2e deps (standalone project)
        working-directory: e2e
        run: npm ci
      - name: full-stack regression (harness boots Router + 15 services + mock chain)
        working-directory: e2e
        run: npx jest --runInBand

  portal-tsc:
    name: Portal type-check (system + operator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # One lockfile per portal (npm only — yarn.lock removed, registries
      # normalized to npmjs.org) so `npm ci` installs the committed tree
      # deterministically and fails loudly on drift instead of rewriting it.
      - name: tsc — portal/system
        working-directory: portal/system
        run: npm ci && npx tsc --noEmit
      - name: tsc — portal/operator
        working-directory: portal/operator
        run: npm ci && npx tsc --noEmit

  frontend-build:
    name: Frontend bundles (build shipped artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build operator + system + mobile bundles (deploy/build-frontend.sh)
        working-directory: .
        run: bash deploy/build-frontend.sh
      - name: upload version-pinned frontend bundles
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundles
          path: |
            portal/publish/*.tar.gz
            client/publish/*.tar.gz
          retention-days: 14

  ui-e2e:
    name: UI e2e (Playwright — system + operator, mesh-backed)
    runs-on: ubuntu-latest
    # BLOCKING on the stable core (--grep-invert @quarantine). Known-unstable deep-flow
    # specs (AI-sentinel/bot-provisioning/fulfillment-profile/watcher creation) are tagged
    # @quarantine and run in a SEPARATE non-blocking step until stabilized — see
    # e2e/ui/README.md "Quarantine". This keeps the gate green-or-red on what's reliable.
    timeout-minutes: 30
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6699:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6699
      E2E_PROFILE: full
      SOLO_ROUTER_URL: http://localhost:8600
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      # operator portal login gates on categories.POWER === 'operator'; meshup seeds this user.
      TEST_USER: e2e-operator
      TEST_PASSWORD: changeme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install api deps (services spawn from api/)
        working-directory: api
        run: npm ci
      - name: install e2e deps
        working-directory: e2e
        run: npm ci
      - name: install e2e/ui deps (Playwright)
        working-directory: e2e/ui
        run: npm ci
      - name: install portal/system deps
        working-directory: portal/system
        run: npm ci
      - name: install portal/operator deps
        working-directory: portal/operator
        run: npm ci
      - name: install Playwright chromium
        working-directory: e2e/ui
        run: npx playwright install --with-deps chromium
      - name: bring up mesh (13 services + admin & operator seed)
        # working-directory: . —— 本工作流顶层设了 `defaults.run.working-directory: api`,
        # 本 job 每一步都显式覆盖过,唯独这步漏了 ⇒ CI 里实际跑的是 `api/e2e/ui/scripts/
        # meshup.js`(不存在),node 秒退进日志,下面 180 秒的等待循环注定等不到 readiness,
        # 报出来的却是含糊的 "mesh failed to start"。本地怎么跑都对(仓库根),只在 CI 里挂。
        working-directory: .
        run: |
          set -e
          ( node e2e/ui/scripts/meshup.js > /tmp/ui-meshup.log 2>&1 & )
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8699/ >/dev/null 2>&1 && break; sleep 1; done
          if ! curl -sf http://127.0.0.1:8699/ >/dev/null 2>&1; then echo "::error::mesh failed to start"; tail -60 /tmp/ui-meshup.log; exit 1; fi
          echo "mesh ready (admin + e2e-operator seeded)"
      # Playwright's webServer auto-serves the system (:9200) + operator (:9300) portals
      # (playwright.config.ts) — no manual vite choreography. globalSetup logs in admin
      # (system) + e2e-operator (operator).
      - name: ui-e2e stable core (system + operator) — BLOCKING
        working-directory: e2e/ui
        run: npx playwright test --grep-invert "@quarantine"
      - name: ui-e2e quarantine (known-unstable deep-flow specs) — non-blocking, stabilizing
        working-directory: e2e/ui
        continue-on-error: true
        run: npx playwright test --grep "@quarantine"
      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: e2e/ui/playwright-report
          retention-days: 7

  ui-e2e-mobile:
    name: UI e2e (Playwright — mobile, route-mocked)
    runs-on: ubuntu-latest
    # BLOCKING — route-mocked, no mesh/Redis, so it's fast and deterministic.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install e2e/ui deps (Playwright)
        working-directory: e2e/ui
        run: npm ci
      - name: install client/mobile deps
        working-directory: client/mobile
        run: npm ci
      - name: install Playwright chromium
        working-directory: e2e/ui
        run: npx playwright install --with-deps chromium
      # Route-mocked (helpers/mobile.ts): no mesh, no Redis. The mobile config's webServer
      # boots vite :9500.
      - name: ui-e2e mobile (route-mocked) — BLOCKING
        working-directory: e2e/ui
        run: npx playwright test --config=playwright.mobile.config.ts
      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: e2e/ui/playwright-report
          retention-days: 7
