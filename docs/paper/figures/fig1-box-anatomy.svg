<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#345995"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#ffffff"/>

  <!-- ===== the box ===== -->
  <rect x="36" y="40" width="540" height="204" rx="10" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="266" y="30" width="80" height="20" fill="#ffffff"/>
  <text x="306" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" letter-spacing="2">ONE BOX</text>

  <!-- frame zone -->
  <rect x="50" y="62" width="512" height="84" rx="4" fill="#e8ecf2"/>
  <text x="64" y="86" font-size="12.5" fill="#222">
    <tspan font-weight="bold">FRAME</tspan> — byte-identical in every box, not the box&#8217;s to edit:
  </text>
  <text x="64" y="108" font-size="11.5" fill="#444">framework code &#183; wire contracts &#183; authoring rules &#183; checkers &#183;</text>
  <text x="64" y="126" font-size="11.5" fill="#444">deployment machinery</text>

  <!-- divider -->
  <line x1="50" y1="158" x2="562" y2="158" stroke="#999" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- payload zone -->
  <text x="64" y="188" font-size="12.5" fill="#222">
    <tspan font-weight="bold">PAYLOAD</tspan> — this box&#8217;s own, never touched by upgrades:
  </text>
  <text x="64" y="210" font-size="11.5" fill="#444">services &#183; data &#183; environment &#183; purpose documents</text>

  <!-- R1 overwrite annotation, right side -->
  <line x1="676" y1="112" x2="576" y2="112" stroke="#345995" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="66" font-size="12" fill="#345995" font-weight="bold">R1</text>
  <text x="600" y="84" font-size="11" fill="#345995">upgrade overwrites</text>
  <text x="600" y="99" font-size="11" fill="#345995">the frame wholesale</text>

  <!-- R4 annotation: call leaving the box -->
  <line x1="576" y1="196" x2="688" y2="196" stroke="#555" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="592" y="216" font-size="11" fill="#555" font-style="italic">calls leaving the box</text>
  <text x="592" y="231" font-size="11" fill="#555" font-style="italic">are mediated</text>
  <text x="655" y="188" font-size="12" fill="#345995" font-weight="bold">R4</text>

  <!-- ===== the editing loop ===== -->
  <text x="36" y="310" font-size="12" font-weight="bold" fill="#333" letter-spacing="1.5">ONE CONVERSATIONAL TURN</text>

  <!-- timeline nodes -->
  <g font-size="11.5" fill="#222" text-anchor="middle">
    <rect x="36" y="330" width="104" height="46" rx="7" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <text x="88" y="349">turn begins</text>
    <text x="88" y="365" font-size="10.5" fill="#666">context loads</text>

    <rect x="188" y="330" width="104" height="46" rx="7" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <text x="240" y="349">AI proposes</text>
    <text x="240" y="365" font-size="10.5" fill="#666">(intent)</text>

    <rect x="340" y="330" width="104" height="46" rx="7" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <text x="392" y="349">AI edits</text>
    <text x="392" y="365" font-size="10.5" fill="#666">(code)</text>

    <rect x="492" y="330" width="112" height="46" rx="7" fill="#eef1f7" stroke="#345995" stroke-width="1.6"/>
    <text x="548" y="349">post-edit gate</text>
    <text x="548" y="365" font-size="10.5" fill="#666">contract check</text>

    <rect x="652" y="330" width="72" height="46" rx="7" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <text x="688" y="356">done</text>
  </g>
  <g stroke="#555" stroke-width="1.4">
    <line x1="140" y1="353" x2="184" y2="353" marker-end="url(#arrow)"/>
    <line x1="292" y1="353" x2="336" y2="353" marker-end="url(#arrow)"/>
    <line x1="444" y1="353" x2="488" y2="353" marker-end="url(#arrow)"/>
    <line x1="604" y1="353" x2="648" y2="353" marker-end="url(#arrow)"/>
  </g>

  <!-- R3 annotation under "turn begins" -->
  <line x1="88" y1="424" x2="88" y2="380" stroke="#345995" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <text x="36" y="442" font-size="12" fill="#345995" font-weight="bold">R3</text>
  <text x="58" y="442" font-size="11" fill="#345995">governing document loaded</text>
  <text x="58" y="457" font-size="11" fill="#345995">every turn, before any code</text>

  <!-- R1 annotation under gate -->
  <line x1="548" y1="424" x2="548" y2="380" stroke="#345995" stroke-width="1.6" marker-end="url(#arrowAccent)"/>
  <text x="496" y="442" font-size="12" fill="#345995" font-weight="bold">R1</text>
  <text x="518" y="442" font-size="11" fill="#345995">a contract-breaking edit</text>
  <text x="518" y="457" font-size="11" fill="#345995">fails immediately, at AI speed</text>

  <!-- ===== R5 footer ===== -->
  <line x1="36" y1="492" x2="724" y2="492" stroke="#ddd" stroke-width="1"/>
  <text x="36" y="518" font-size="12" fill="#345995" font-weight="bold">R5</text>
  <text x="60" y="518" font-size="11" fill="#333">at startup, the box proves the resources it claims (ports, databases, inherited environment)</text>
  <text x="60" y="534" font-size="11" fill="#333">are exclusively its own — and refuses to start when it cannot</text>
</svg>
